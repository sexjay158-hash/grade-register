name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      STABILITY_REPORT_DIR: ${{ github.workspace }}/quality-reports
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-integration-reports
          path: quality-reports/
          if-no-files-found: ignore
          retention-days: 14
